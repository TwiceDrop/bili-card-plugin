<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      {{if bodyFontFile}}
      @font-face {
        font-family: "BiliCardBodyCustom";
        src: url("{{@ pluResPath}}fonts/{{@ bodyFontUrl}}") format("{{bodyFontFormat}}");
        font-display: swap;
      }
      {{/if}}
      {{if titleFontFile}}
      @font-face {
        font-family: "BiliCardTitleCustom";
        src: url("{{@ pluResPath}}fonts/{{@ titleFontUrl}}") format("{{titleFontFormat}}");
        font-display: swap;
      }
      {{/if}}

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: transparent; }
      #container {
        width: {{cardWidth}}px;
        container-type: inline-size;
        padding: 1.55cqw;
        color: #241d30;
        font-family: {{if bodyFontFile}}"BiliCardBodyCustom"{{else}}{{bodyFontFamily}}{{/if}};
        font-weight: {{bodyFontWeight}};
        background:
          radial-gradient(circle at 4% 5%, rgba(171, 141, 255, 0.72), transparent 31%),
          radial-gradient(circle at 98% 96%, rgba(255, 155, 187, 0.73), transparent 36%),
          linear-gradient(145deg, #d6c7ff 0%, #f1d9ef 55%, #ffd7df 100%);
        overflow: hidden;
      }
      .shadow {
        box-shadow: 0 0.38cqw 0.95cqw rgba(67, 42, 91, 0.23),
          inset 0 0 0 0.18cqw rgba(255, 255, 255, 0.8);
      }
      .header {
        position: relative;
        height: 14.5cqw;
        overflow: hidden;
        border-radius: 1.45cqw;
        background: linear-gradient(105deg, #9f88de, #c9b7ed 58%, #e3c8e8);
      }
      .header-bg {
        position: absolute;
        inset: -4cqw;
        width: calc(100% + 8cqw);
        height: calc(100% + 8cqw);
        object-fit: cover;
        filter: blur(1.8cqw) saturate(0.75);
        opacity: 0.34;
      }
      .header::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(130, 99, 201, 0.64), rgba(225, 201, 230, 0.58));
      }
      .profile {
        position: absolute;
        z-index: 2;
        inset: 1.15cqw auto auto 2.4cqw;
        display: flex;
        height: 12.2cqw;
        align-items: center;
        gap: 1.8cqw;
      }
      .avatar-wrap {
        width: 11.2cqw;
        height: 11.2cqw;
        overflow: hidden;
        border: 0.38cqw solid #fff;
        border-radius: 50%;
        background: #e9e1ff;
        box-shadow: 0 0.35cqw 0.8cqw rgba(50, 30, 82, 0.35);
      }
      .avatar { width: 100%; height: 100%; object-fit: cover; }
      .avatar-fallback {
        width: 100%; height: 100%; display: grid; place-items: center;
        color: #7254b1; font-size: 4.8cqw; font-weight: 900;
      }
      .author-copy { color: #fff; text-shadow: 0 0.25cqw 0.35cqw rgba(78, 48, 120, 0.62); }
      .author-name {
        max-width: 59cqw;
        overflow: hidden;
        font-family: {{if titleFontFile}}"BiliCardTitleCustom"{{else}}{{titleFontFamily}}{{/if}};
        font-size: 4.7cqw;
        font-weight: {{titleFontWeight}};
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .publish-time { margin-top: 0.7cqw; font-size: 3.05cqw; font-weight: 800; }
      .qr-wrap {
        position: absolute;
        z-index: 3;
        top: 0.55cqw;
        right: 0.65cqw;
        width: 13.2cqw;
        height: 13.2cqw;
        padding: 0.25cqw;
        border-radius: 0.65cqw;
        background: rgba(255, 255, 255, 0.95);
      }
      .qr { width: 100%; height: 100%; display: block; }
      .media {
        position: relative;
        height: 54.3cqw;
        margin-top: 1.35cqw;
        overflow: hidden;
        border: 0.2cqw solid rgba(255, 255, 255, 0.98);
        border-radius: 1.25cqw 1.25cqw 0 0;
        background: linear-gradient(145deg, #8e7ac3, #d7a8cf);
      }
      .cover { width: 100%; height: 100%; display: block; object-fit: cover; }
      .cover-fallback {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: rgba(255,255,255,.82); font-size: 8cqw; font-weight: 900;
      }
      .media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 55%, rgba(30, 16, 42, 0.52));
        pointer-events: none;
      }
      .live-tab {
        position: absolute;
        z-index: 3;
        top: 0;
        right: 0;
        padding: 0.8cqw 1.8cqw 1cqw;
        border-radius: 0 1.05cqw 0 1.15cqw;
        color: #fff;
        background: rgba(241, 78, 117, 0.96);
        box-shadow: 0 0.3cqw 0.6cqw rgba(65, 23, 44, 0.42);
        font-size: 2.8cqw;
        font-weight: 900;
      }
      .live-state {
        position: absolute;
        z-index: 3;
        left: 3cqw;
        bottom: 2.2cqw;
        display: flex;
        align-items: center;
        gap: 1cqw;
        color: #fff;
        font-size: 2.5cqw;
        font-weight: 900;
        text-shadow: 0 0.2cqw 0.4cqw rgba(0,0,0,.62);
      }
      .dot {
        width: 1.35cqw;
        height: 1.35cqw;
        border-radius: 50%;
        background: #ff4e78;
        box-shadow: 0 0 0 0.5cqw rgba(255, 78, 120, 0.24);
      }
      .footer {
        padding: 1.65cqw 1.9cqw 1.8cqw;
        border-radius: 0 0 1.25cqw 1.25cqw;
        background: rgba(255, 250, 253, 0.93);
      }
      .title {
        display: -webkit-box;
        overflow: hidden;
        font-family: {{if titleFontFile}}"BiliCardTitleCustom"{{else}}{{titleFontFamily}}{{/if}};
        font-size: 3.15cqw;
        font-weight: {{titleFontWeight}};
        line-height: 1.3;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .meta {
        display: flex;
        margin-top: 1cqw;
        justify-content: space-between;
        color: #65586f;
        font-size: 2.05cqw;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <section class="header shadow">
        {{if headerBackground}}<img class="header-bg" src="{{headerBackground}}" alt="" />{{/if}}
        <div class="profile">
          <div class="avatar-wrap">
            {{if avatarDataUrl}}<img class="avatar" src="{{avatarDataUrl}}" alt="" />
            {{else}}<div class="avatar-fallback">{{avatarFallback}}</div>{{/if}}
          </div>
          <div class="author-copy">
            <div class="author-name">{{authorName}}</div>
            <div class="publish-time">{{publishTime}}</div>
          </div>
        </div>
        <div class="qr-wrap"><img class="qr" src="{{qrDataUrl}}" alt="直播间二维码" /></div>
      </section>
      <section class="media shadow">
        {{if coverDataUrl}}<img class="cover" src="{{coverDataUrl}}" alt="直播封面" />
        {{else}}<div class="cover-fallback">BILIBILI LIVE</div>{{/if}}
        <div class="live-tab">直播中</div>
        <div class="live-state"><span class="dot"></span><span>{{online}}人气</span></div>
      </section>
      <section class="footer shadow">
        <div class="title">{{title}}</div>
        <div class="meta"><span>{{area}}</span><span>直播间 {{roomId}}</span></div>
      </section>
    </div>
  </body>
</html>
